- name: 'KiBV-2.1 KiBG-4.1 KiBG-20.2 Normalfall: Stadt St.Gallen → Wohnsitz JA, Zusatzbeiträge 0 (AN-04)'
  period: 2028-09
  absolute_error_margin: 0.01
  input:
    persons:
      mutter: {erwerbspensum: 100, me_veranlagung: 60000}
      vater: {erwerbspensum: 60, me_veranlagung: 37000}
      lina: {alter_monate: 26, schulstufe: VORSCHULALTER, angebot_typ: KITA, angebot_angemeldet: JA, betreuungstage_pro_woche: 2, betreuungsstunden_pro_tag: 10, kosten_pro_stunde: 12, betreuungsbeginn: '2028-08-15'}
    familien:
      familie:
        erziehungsberechtigte: [mutter, vater]
        kinder: [lina]
        wohngemeinde: ST_GALLEN
        haushalt_form: GEMEINSAMER_HAUSHALT
        gesuchsdatum: '2028-08-30'
  output: {wohnsitz_sg: JA, zusatzbeitrag_z1_pro_stunde: 0, zusatzbeitrag_z2_pro_stunde: 0}
