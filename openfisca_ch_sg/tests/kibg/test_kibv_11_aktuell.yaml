# Ausgangslage aller Tests: Grundfamilie F1 (Teil A, A8). Jeder Test variiert nur die geprüfte Angabe.
- name: 'KiBV-11.1 Normalfall: ohne Antrag zählt die Veranlagung, auch bei grosser Abweichung'
  period: 2028-09
  absolute_error_margin: 0.01
  input:
    persons:
      mutter: {erwerbspensum: 100, me_veranlagung: 100000}
      vater: {erwerbspensum: 60, me_veranlagung: 0}
      lina: {alter_monate: 26, schulstufe: VORSCHULALTER, angebot_typ: KITA, angebot_angemeldet: JA, betreuungstage_pro_woche: 2, betreuungsstunden_pro_tag: 10, kosten_pro_stunde: 12, betreuungsbeginn: '2028-08-15'}
    familien:
      familie:
        erziehungsberechtigte: [mutter, vater]
        kinder: [lina]
        wohngemeinde: ST_GALLEN
        haushalt_form: GEMEINSAMER_HAUSHALT
        gesuchsdatum: '2028-08-30'
        me_aktuell: 50000
        antrag_aktuelle_gegebenheiten: false
  output: {me_massgebend: 100000}
